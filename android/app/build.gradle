plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.redflags.app"
    signingConfigs {
        debug {
            storeFile file('/Users/brianliu/.android/debug.keystore')
        }
        release {
            storeFile file('/Users/brianliu/.android/upload-keystore.jks')
            keyAlias 'upload'
            storePassword localProperties.getProperty('android.prod.storePassword')
            keyPassword localProperties.getProperty('android.prod.keyPassword')
        }
    }
    flavorDimensions += "env"
    productFlavors {
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Red Flags Dev"
            resValue "string", "facebook_app_id", localProperties.getProperty('facebook.dev.appId')
            resValue "string", "facebook_client_token", localProperties.getProperty('facebook.dev.clientToken')
            resValue "string", "fb_login_protocol_scheme", localProperties.getProperty('facebook.dev.loginScheme')
            signingConfig signingConfigs.debug
        }
        prod {
            dimension "env"
            resValue "string", "app_name", "Red Flags"
            resValue "string", "facebook_app_id", localProperties.getProperty('facebook.prod.appId')
            resValue "string", "facebook_client_token", localProperties.getProperty('facebook.prod.clientToken')
            resValue "string", "fb_login_protocol_scheme", localProperties.getProperty('facebook.prod.loginScheme')
            signingConfig signingConfigs.release
        }
    }

    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.redflags.app"
        /// cloud_firestore plugin requires Android SDK 19 above
        /// flutter_facebook_auth requires Android SDK 21
        minSdkVersion 21
        targetSdkVersion 33
        compileSdk flutter.compileSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0"
}
