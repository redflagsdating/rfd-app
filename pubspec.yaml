name: red_flags
description: Red Flags Dating app.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.7+30

environment:
  sdk: ">=3.0.5 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  firebase_core: ^3.5.0
  firebase_auth: ^5.3.0
  google_sign_in: ^6.1.4
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  firebase_storage: ^12.3.1
  cloud_firestore: ^5.4.2
  flutter_facebook_auth: ^7.1.1
  logger: ^2.0.1
  firebase_crashlytics: ^4.1.2
  firebase_dynamic_links: ^6.0.7
  package_info_plus: ^8.0.2
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_flavor: ^3.1.3
  email_validator: ^3.0.0
  dots_indicator: ^3.0.0
  animations: ^2.0.8
  flutter_form_builder: ^9.1.1
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  app_settings: ^5.1.1
  image_picker: ^1.0.4
  image_cropper: ^8.0.2
  uuid: ^4.2.1
  path_provider: ^2.1.1
  dotted_border: ^2.1.0
  # Locked version due to 2.1.1 has breaking changes (revisit)
  textfield_tags: ^3.0.1
  font_awesome_flutter: ^10.6.0
  permission_handler: ^11.1.0
  flutter_idensic_mobile_sdk_plugin: 1.28.0
  flutter_dotenv: ^5.1.0
  http: ^1.1.2
  crypto: ^3.0.3
  loading_animation_widget: ^1.2.0+4
  firebase_app_check: ^0.3.1+2
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1
  url_launcher: ^6.2.2
  carousel_slider: ^5.0.0
  table_calendar: ^3.0.9
  flutter_svg: ^2.0.9
  age_calculator: ^1.0.0
  cloud_functions: ^5.1.2
  photo_view: ^0.15.0
  mime: ^1.0.5
  firebase_messaging: ^15.1.2
  flutter_local_notifications: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  change_app_package_name: ^1.1.0
  fake_cloud_firestore: ^3.0.3
  firebase_auth_mocks: ^0.14.1
  google_sign_in_mocks: ^0.3.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # Generate l10n
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - .env
    - .env.dev
    - assets/rf-logo-white.png
    - assets/rf-logo-red.png
    - assets/rf-logo-black.png
    - assets/signin-bg.jpg
    - assets/signin-splash-bg.jpg
    - assets/onboard-splash-bg.png
    - assets/onboard-complete-splash-bg.jpg
    - assets/rfi-daily-profile.svg
    - assets/rfi-red-flags.svg
    - assets/rfi-real-talk.svg
    - assets/rfi-daily-profile-transparent.svg
    - assets/rfi-red-flags-transparent.svg
    - assets/rfi-real-talk-transparent.svg
    - assets/opt-in-date-splash-bg.png
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-ExtraLight.ttf
          weight: 200
        - asset: fonts/Nunito-ExtraLightItalic.ttf
          style: italic
          weight: 200
        - asset: fonts/Nunito-Light.ttf
          weight: 300
        - asset: fonts/Nunito-LightItalic.ttf
          style: italic
          weight: 300
        - asset: fonts/Nunito-Regular.ttf
        - asset: fonts/Nunito-Italic.ttf
          style: italic
        - asset: fonts/Nunito-Medium.ttf
          weight: 500
        - asset: fonts/Nunito-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-SemiBoldItalic.ttf
          style: italic
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-BoldItalic.ttf
          style: italic
          weight: 700
        - asset: fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: fonts/Nunito-ExtraBoldItalic.ttf
          style: italic
          weight: 800
        - asset: fonts/Nunito-Black.ttf
          weight: 900
        - asset: fonts/Nunito-BlackItalic.ttf
          style: italic
          weight: 900
    - family: LeagueSpartan
      fonts:
        - asset: fonts/LeagueSpartan-Thin.ttf
          weight: 100
        - asset: fonts/LeagueSpartan-ExtraLight.ttf
          weight: 200
        - asset: fonts/LeagueSpartan-Light.ttf
          weight: 300
        - asset: fonts/LeagueSpartan-Regular.ttf
        - asset: fonts/LeagueSpartan-Medium.ttf
          weight: 500
        - asset: fonts/LeagueSpartan-SemiBold.ttf
          weight: 600
        - asset: fonts/LeagueSpartan-Bold.ttf
          weight: 700
        - asset: fonts/LeagueSpartan-ExtraBold.ttf
          weight: 800
        - asset: fonts/LeagueSpartan-Black.ttf
          weight: 900
